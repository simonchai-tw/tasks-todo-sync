<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">How Tasks–To Do Sync Works: Ecosystem Loop</title>
  <desc id="desc">Bidirectional synchronization between Google Tasks and Microsoft To Do with ecosystem integrations across Google, Microsoft, and Apple Reminders.</desc>

  <defs>
    <style>
      text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        text-rendering: geometricPrecision;
        -webkit-font-smoothing: antialiased;
      }
    </style>
    <!-- Drop Shadow Filters (applied ONLY to background rects/circles, NEVER to text) -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <filter id="hubShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>

    <!-- Arrow Markers (orient="auto" points in the line direction) -->
    <marker id="arrowRight" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#0f172a"/>
    </marker>
    <marker id="arrowLeft" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 8.5 1.5 L 0 5 L 8.5 8.5 z" fill="#0f172a"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowIndigo" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#4f46e5"/>
    </marker>

    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="bridgeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="640" rx="20" fill="url(#bgGrad)"/>

  <!-- ====================================================================== -->
  <!-- LAYER 1: ECOSYSTEM CONTAINER BOXES (Uniform Sizing: Width = 400px)     -->
  <!-- ====================================================================== -->
  <!-- Google Ecosystem Outer Box (Left: 40..440) -->
  <rect x="40" y="30" width="400" height="375" rx="18" fill="#ffffff" stroke="#3b82f6" stroke-width="2.5" stroke-opacity="0.85" filter="url(#cardShadow)"/>
  <text x="240" y="69" text-anchor="middle" fill="#0f172a" font-size="19" font-weight="800" letter-spacing="1.5">GOOGLE ECOSYSTEM</text>

  <!-- Microsoft Ecosystem Outer Box (Right Top: 760..1160) -->
  <rect x="760" y="30" width="400" height="375" rx="18" fill="#ffffff" stroke="#6366f1" stroke-width="2.5" stroke-opacity="0.85" filter="url(#cardShadow)"/>
  <text x="960" y="69" text-anchor="middle" fill="#0f172a" font-size="19" font-weight="800" letter-spacing="1.5">MICROSOFT ECOSYSTEM</text>

  <!-- Apple Ecosystem Outer Box (Right Bottom: 760..1160, Aligned with Microsoft) -->
  <rect x="760" y="435" width="400" height="175" rx="18" fill="#f8fafc" stroke="#64748b" stroke-width="2" stroke-opacity="0.6" filter="url(#cardShadow)"/>
  <text x="785" y="464" fill="#334155" font-size="15" font-weight="800" letter-spacing="1.2">APPLE ECOSYSTEM</text>
  <text x="1135" y="464" text-anchor="end" fill="#64748b" font-size="13.5" font-weight="700">Native Account Sync</text>

  <!-- ====================================================================== -->
  <!-- LAYER 2: SERVICE PILLS & HUBS (NO filters on text groups)              -->
  <!-- ====================================================================== -->

  <!-- Google Internal Connectors -->
  <line x1="190" y1="130" x2="285" y2="215" stroke="#3b82f6" stroke-width="2.5" stroke-dasharray="4,4" stroke-opacity="0.8"/>
  <line x1="190" y1="217" x2="285" y2="217" stroke="#3b82f6" stroke-width="2.5" stroke-dasharray="4,4" stroke-opacity="0.8"/>
  <line x1="190" y1="305" x2="285" y2="225" stroke="#3b82f6" stroke-width="2.5" stroke-dasharray="4,4" stroke-opacity="0.8"/>

  <!-- Google Pill 1: Gmail (Generic Mail Envelope) -->
  <g transform="translate(60, 95)">
    <rect width="130" height="70" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#cardShadow)"/>
    <rect x="12" y="15" width="40" height="40" rx="10" fill="#eff6ff"/>
    <path d="M 22 28 L 32 35 L 42 28 M 22 27 L 42 27 C 43.1 27 44 27.9 44 29 L 44 41 C 44 42.1 43.1 43 42 43 L 22 43 C 20.9 43 20 42.1 20 41 L 20 29 C 20 27.9 20.9 27 22 27 Z" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="62" y="42" fill="#0f172a" font-size="18" font-weight="700">Gmail</text>
  </g>

  <!-- Google Pill 2: Gemini (Generic AI Sparkle Star) -->
  <g transform="translate(60, 182)">
    <rect width="130" height="70" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#cardShadow)"/>
    <rect x="12" y="15" width="40" height="40" rx="10" fill="#eff6ff"/>
    <path d="M 32 23 C 32 28 36 32 41 32 C 36 32 32 36 32 41 C 32 36 28 32 23 32 C 28 32 32 28 32 23 Z" fill="#2563eb"/>
    <text x="62" y="42" fill="#0f172a" font-size="18" font-weight="700">Gemini</text>
  </g>

  <!-- Google Pill 3: Android (Generic Mobile Phone Outline) -->
  <g transform="translate(60, 270)">
    <rect width="130" height="70" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#cardShadow)"/>
    <rect x="12" y="15" width="40" height="40" rx="10" fill="#eff6ff"/>
    <rect x="25" y="23" width="14" height="24" rx="3" fill="none" stroke="#2563eb" stroke-width="2"/>
    <line x1="29" y1="43" x2="35" y2="43" stroke="#2563eb" stroke-width="2" stroke-linecap="round"/>
    <text x="62" y="42" fill="#0f172a" font-size="18" font-weight="700">Android</text>
  </g>

  <!-- Google Tasks Hub (Center cx=345) -->
  <g transform="translate(345, 217)">
    <circle r="60" fill="#ffffff" stroke="#2563eb" stroke-width="3.5" filter="url(#hubShadow)"/>
    <text x="0" y="-8" text-anchor="middle" fill="#0f172a" font-size="21" font-weight="800">Google</text>
    <text x="0" y="20" text-anchor="middle" fill="#0f172a" font-size="21" font-weight="800">Tasks</text>
  </g>

  <!-- Microsoft Internal Connectors -->
  <line x1="915" y1="210" x2="980" y2="130" stroke="#6366f1" stroke-width="2.5" stroke-dasharray="4,4" stroke-opacity="0.8"/>
  <line x1="915" y1="217" x2="980" y2="217" stroke="#6366f1" stroke-width="2.5" stroke-dasharray="4,4" stroke-opacity="0.8"/>
  <line x1="915" y1="225" x2="980" y2="305" stroke="#6366f1" stroke-width="2.5" stroke-dasharray="4,4" stroke-opacity="0.8"/>

  <!-- Microsoft Pill 1: Outlook (Generic Mail & Flag Icon) -->
  <g transform="translate(980, 95)">
    <rect width="165" height="70" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#cardShadow)"/>
    <rect x="12" y="15" width="40" height="40" rx="10" fill="#eef2ff"/>
    <path d="M 22 28 L 32 35 L 42 28 M 22 27 L 42 27 C 43.1 27 44 27.9 44 29 L 44 41 C 44 42.1 43.1 43 42 43 L 22 43 C 20.9 43 20 42.1 20 41 L 20 29 C 20 27.9 20.9 27 22 27 Z" fill="none" stroke="#4f46e5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="60" y="36" fill="#0f172a" font-size="18" font-weight="700">Outlook</text>
    <text x="60" y="54" fill="#64748b" font-size="13.5" font-weight="600">Mail &amp; Flagged</text>
  </g>

  <!-- Microsoft Pill 2: Copilot (Generic AI Sparkle Star) -->
  <g transform="translate(980, 182)">
    <rect width="165" height="70" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#cardShadow)"/>
    <rect x="12" y="15" width="40" height="40" rx="10" fill="#faf5ff"/>
    <path d="M 32 23 C 32 27.5 35.5 31 40 31 C 35.5 31 32 34.5 32 39 C 32 34.5 28.5 31 24 31 C 28.5 31 32 27.5 32 23 Z" fill="#7c3aed"/>
    <circle cx="39" cy="24" r="2" fill="#9333ea"/>
    <text x="60" y="36" fill="#0f172a" font-size="18" font-weight="700">Copilot</text>
    <text x="60" y="54" fill="#64748b" font-size="13.5" font-weight="600">Microsoft 365 AI</text>
  </g>

  <!-- Microsoft Pill 3: Windows (Generic Desktop PC Monitor - NO Trademark Logo) -->
  <g transform="translate(980, 270)">
    <rect width="165" height="70" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#cardShadow)"/>
    <rect x="12" y="15" width="40" height="40" rx="10" fill="#eef2ff"/>
    <rect x="22" y="24" width="20" height="15" rx="2" fill="none" stroke="#0284c7" stroke-width="2"/>
    <line x1="32" y1="39" x2="32" y2="44" stroke="#0284c7" stroke-width="2"/>
    <line x1="27" y1="44" x2="37" y2="44" stroke="#0284c7" stroke-width="2" stroke-linecap="round"/>
    <text x="60" y="36" fill="#0f172a" font-size="18" font-weight="700">Windows</text>
    <text x="60" y="54" fill="#64748b" font-size="13.5" font-weight="600">PC &amp; Desktop App</text>
  </g>

  <!-- Microsoft To Do Hub (Centered at cx=855) -->
  <g transform="translate(855, 217)">
    <circle r="60" fill="#ffffff" stroke="#6366f1" stroke-width="3.5" filter="url(#hubShadow)"/>
    <text x="0" y="-8" text-anchor="middle" fill="#0f172a" font-size="21" font-weight="800">Microsoft</text>
    <text x="0" y="20" text-anchor="middle" fill="#0f172a" font-size="21" font-weight="800">To Do</text>
  </g>

  <!-- Apple Target: Reminders Card (Directly centered under Microsoft To Do at x=855) -->
  <g transform="translate(775, 475)">
    <rect width="160" height="115" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="2.5" filter="url(#cardShadow)"/>
    <!-- Generic Checklist Icon -->
    <g transform="translate(14, 24)">
      <circle cx="8" cy="10" r="4.5" fill="#3b82f6"/>
      <line x1="18" y1="10" x2="34" y2="10" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="8" cy="26" r="4.5" fill="#10b981"/>
      <line x1="18" y1="26" x2="34" y2="26" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="8" cy="42" r="4.5" fill="#f59e0b"/>
      <line x1="18" y1="42" x2="34" y2="42" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round"/>
    </g>
    <text x="60" y="44" fill="#0f172a" font-size="20" font-weight="800">Reminders</text>
    <rect x="60" y="55" width="88" height="22" rx="6" fill="#eff6ff"/>
    <text x="68" y="70" fill="#2563eb" font-size="12" font-weight="800">SYNCED APP</text>
    <text x="60" y="96" fill="#64748b" font-size="13.5" font-weight="600">iCloud / Exchange</text>
  </g>

  <!-- Reminders to Devices Arrow -->
  <g transform="translate(945, 532)">
    <line x1="0" y1="0" x2="26" y2="0" stroke="#2563eb" stroke-width="3" marker-end="url(#arrowBlue)"/>
  </g>

  <!-- Hardware Devices Container (iPhone & Mac Only) -->
  <g transform="translate(980, 475)">
    <rect width="160" height="115" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#cardShadow)"/>
    <text x="14" y="25" fill="#64748b" font-size="12" font-weight="800" letter-spacing="0.8">DEVICES</text>

    <!-- iPhone (Mobile) -->
    <g transform="translate(18, 34)">
      <rect x="6" y="6" width="22" height="42" rx="4" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
      <line x1="13" y1="43" x2="21" y2="43" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
      <circle cx="17" cy="11" r="1.5" fill="#475569"/>
      <text x="17" y="66" text-anchor="middle" fill="#0f172a" font-size="14" font-weight="700">iPhone</text>
    </g>

    <!-- Mac (Desktop) -->
    <g transform="translate(86, 34)">
      <rect x="8" y="12" width="44" height="28" rx="3" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
      <path d="M 2 40 L 58 40 C 59 40 59 42 58 42 L 2 42 C 1 42 1 40 2 40 Z" fill="#475569"/>
      <text x="30" y="66" text-anchor="middle" fill="#0f172a" font-size="14" font-weight="700">Mac</text>
    </g>
  </g>

  <!-- ====================================================================== -->
  <!-- LAYER 3: BRIDGE & CROSS-ECOSYSTEM CONNECTIONS (ON TOP)                 -->
  <!-- ====================================================================== -->

  <!-- Center Bridge Card (Centered at x=600, 490..710) -->
  <g transform="translate(490, 137)">
    <rect width="220" height="160" rx="18" fill="url(#bridgeGrad)" stroke="#f59e0b" stroke-width="2.5" filter="url(#cardShadow)"/>
    <text x="110" y="48" text-anchor="middle" fill="#0f172a" font-size="22" font-weight="800">Tasks–To Do</text>
    <text x="110" y="78" text-anchor="middle" fill="#0f172a" font-size="22" font-weight="800">Sync</text>
    <line x1="30" y1="95" x2="190" y2="95" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3,3"/>
    <text x="110" y="120" text-anchor="middle" fill="#334155" font-size="15.5" font-weight="700">Google Apps Script</text>
    <text x="110" y="142" text-anchor="middle" fill="#64748b" font-size="13.5" font-weight="600">Runs in your account</text>
  </g>

  <!-- Bi-directional Cross Sync Arrows: Exactly 85px each side -->
  <!-- Left: 405 -> 490 (Google Tasks to Bridge) -->
  <line x1="405" y1="217" x2="490" y2="217" stroke="#0f172a" stroke-width="3.5" marker-start="url(#arrowLeft)" marker-end="url(#arrowRight)"/>
  <!-- Right: 710 -> 795 (Bridge to Microsoft To Do) -->
  <line x1="710" y1="217" x2="795" y2="217" stroke="#0f172a" stroke-width="3.5" marker-start="url(#arrowLeft)" marker-end="url(#arrowRight)"/>

  <!-- 100% Straight Vertical Exchange Sync Connection (x=855) -->
  <line x1="855" y1="277" x2="855" y2="475" stroke="#4f46e5" stroke-width="2.5" stroke-dasharray="5,5" marker-end="url(#arrowIndigo)"/>

  <!-- Exchange Sync Badge on the vertical line (Centered at x=855, y=355) -->
  <g transform="translate(855, 355)">
    <rect x="-76" y="-14" width="152" height="28" rx="14" fill="#ffffff" stroke="#6366f1" stroke-width="1.5" filter="url(#cardShadow)"/>
    <text x="0" y="5" text-anchor="middle" fill="#4338ca" font-size="13" font-weight="700">Exchange Task Sync</text>
  </g>
</svg>
