<svg xmlns="http://www.w3.org/2000/svg" width="840" height="570" viewBox="0 0 840 570" role="img" aria-labelledby="t d">
  <title id="t">Tasks–To Do Sync install flow</title>
  <desc id="d">One command deploys the private project; a browser wizard needs one Google consent and one Microsoft sign-in, then schedules itself.</desc>
  <defs>
    <style>
      text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        text-rendering: geometricPrecision;
        -webkit-font-smoothing: antialiased;
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      }
    </style>
    <!-- Crisp shadow applied ONLY to background rects, NEVER to text -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>

    <!-- Bold, polished directional arrow markers -->
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowIndigo" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#4f46e5"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#059669"/>
    </marker>
  </defs>

  <!-- ====================================================================== -->
  <!-- CLOCKWISE FLOW CONNECTING ARROWS (1 -> 2 -> 3 -> 4)                   -->
  <!-- ====================================================================== -->
  <!-- Arrow 1 -> 2 (Top Horizontal: Deploy -> Google) -->
  <line x1="397" y1="135" x2="439" y2="135" stroke="#2563eb" stroke-width="4.5" stroke-linecap="round" marker-end="url(#arrowBlue)"/>

  <!-- Arrow 2 -> 3 (Right Vertical: Google -> Microsoft) -->
  <line x1="625" y1="237" x2="625" y2="279" stroke="#4f46e5" stroke-width="4.5" stroke-linecap="round" marker-end="url(#arrowIndigo)"/>

  <!-- Arrow 3 -> 4 (Bottom Horizontal: Microsoft -> Finalize) -->
  <line x1="443" y1="385" x2="401" y2="385" stroke="#059669" stroke-width="4.5" stroke-linecap="round" marker-end="url(#arrowGreen)"/>

  <!-- ====================================================================== -->
  <!-- STEP 1: Deploy (Top-Left, x=35, y=35)                                  -->
  <!-- ====================================================================== -->
  <!-- Background Rect with shadow -->
  <rect x="35" y="35" width="360" height="200" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#cardShadow)"/>
  <rect x="35" y="35" width="360" height="6" rx="3" fill="#2563eb"/>
  
  <!-- Content (NO filter applied for crisp text on mobile) -->
  <circle cx="75" cy="78" r="21" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="75" y="86" text-anchor="middle" font-size="22" font-weight="800" fill="#1d4ed8">1</text>
  <text x="110" y="86" font-size="24" font-weight="800" fill="#0f172a">Deploy</text>
  
  <text x="55" y="128" font-size="16.5" font-weight="600" fill="#334155">Run one command in a terminal:</text>
  <rect x="55" y="146" width="320" height="46" rx="10" fill="#0f172a"/>
  <text x="70" y="175" font-size="16.5" class="mono" font-weight="700" fill="#93c5fd">$ npx tasks-todo-sync init</text>

  <!-- ====================================================================== -->
  <!-- STEP 2: Google sign-in (Top-Right, x=445, y=35)                        -->
  <!-- ====================================================================== -->
  <rect x="445" y="35" width="360" height="200" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#cardShadow)"/>
  <rect x="445" y="35" width="360" height="6" rx="3" fill="#0891b2"/>
  
  <circle cx="485" cy="78" r="21" fill="#ecfeff" stroke="#a5f3fc" stroke-width="1.5"/>
  <text x="485" y="86" text-anchor="middle" font-size="22" font-weight="800" fill="#0e7490">2</text>
  <text x="520" y="86" font-size="24" font-weight="800" fill="#0f172a">Google sign-in</text>
  
  <text x="465" y="128" font-size="16.5" font-weight="600" fill="#334155">One consent screen in the</text>
  <text x="465" y="152" font-size="16.5" font-weight="600" fill="#334155">browser wizard that opens.</text>
  <rect x="465" y="168" width="320" height="34" rx="8" fill="#f1f5f9"/>
  <text x="480" y="190" font-size="14" font-weight="600" fill="#64748b">“Unverified app” → Advanced → Allow</text>

  <!-- ====================================================================== -->
  <!-- STEP 3: Microsoft sign-in (Bottom-Right, x=445, y=285)                 -->
  <!-- ====================================================================== -->
  <rect x="445" y="285" width="360" height="200" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#cardShadow)"/>
  <rect x="445" y="285" width="360" height="6" rx="3" fill="#7c3aed"/>
  
  <circle cx="485" cy="328" r="21" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.5"/>
  <text x="485" y="336" text-anchor="middle" font-size="22" font-weight="800" fill="#6d28d9">3</text>
  <text x="520" y="336" font-size="24" font-weight="800" fill="#0f172a">Microsoft sign-in</text>
  
  <text x="465" y="378" font-size="16.5" font-weight="600" fill="#334155">Enter a short code at the</text>
  <text x="465" y="402" font-size="16.5" font-weight="600" fill="#334155">official microsoft.com/link page.</text>
  <rect x="465" y="418" width="320" height="34" rx="8" fill="#f1f5f9"/>
  <text x="480" y="440" font-size="14" font-weight="600" fill="#64748b">No Entra app, secret, or redirect URI</text>

  <!-- ====================================================================== -->
  <!-- STEP 4: Finalize (Bottom-Left, x=35, y=285)                            -->
  <!-- ====================================================================== -->
  <rect x="35" y="285" width="360" height="200" rx="16" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.5" filter="url(#cardShadow)"/>
  <rect x="35" y="285" width="360" height="6" rx="3" fill="#16a34a"/>
  
  <circle cx="75" cy="328" r="21" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="75" y="336" text-anchor="middle" font-size="22" font-weight="800" fill="#15803d">4</text>
  <text x="110" y="336" font-size="24" font-weight="800" fill="#0f172a">Finalize</text>
  
  <text x="55" y="378" font-size="16.5" font-weight="600" fill="#334155">Preview, 10-minute trigger,</text>
  <text x="55" y="402" font-size="16.5" font-weight="600" fill="#334155">and health check run themselves.</text>
  <rect x="55" y="418" width="320" height="34" rx="8" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
  <text x="70" y="440" font-size="14" font-weight="700" fill="#166534">✓ Sync is live — changes land in 0–10 min</text>

  <!-- ====================================================================== -->
  <!-- FOOTER HIGHLIGHT STRIP                                                 -->
  <!-- ====================================================================== -->
  <rect x="35" y="505" width="770" height="46" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <g font-size="15" font-weight="600" fill="#334155">
    <text x="55" y="534">Two sign-ins total</text>
    <circle cx="210" cy="529" r="3" fill="#94a3b8"/>
    <text x="230" y="534">About 3 minutes</text>
    <circle cx="370" cy="529" r="3" fill="#94a3b8"/>
    <text x="390" y="534">Runs in your Google account</text>
    <circle cx="615" cy="529" r="3" fill="#94a3b8"/>
    <text x="635" y="534" fill="#0284c7" font-weight="800">No hosted service</text>
  </g>
</svg>
