<svg xmlns="http://www.w3.org/2000/svg" width="760" height="500" viewBox="0 0 760 500" role="img" aria-labelledby="t d" font-family="Segoe UI, system-ui, -apple-system, sans-serif">
  <title id="t">Tasks–To Do Sync install flow</title>
  <desc id="d">One command deploys the private project; a browser wizard needs one Google consent and one Microsoft sign-in, then schedules itself.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1.5 L8.5,5 L0,8.5 z" fill="#94a3b8"/>
    </marker>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Connectors -->
  <g stroke="#94a3b8" stroke-width="2.2" fill="none" marker-end="url(#arrow)">
    <!-- 1 -> 2 -->
    <line x1="365" y1="115" x2="395" y2="115"/>
    <!-- 3 -> 4 -->
    <line x1="365" y1="325" x2="395" y2="325"/>
  </g>
  <!-- Step 2 to Step 3 flow guidance -->
  <path d="M 570 210 C 570 230, 190 205, 190 225" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="5,5" fill="none"/>

  <!-- Card 1: Deploy -->
  <g filter="url(#soft)">
    <rect x="20" y="20" width="345" height="190" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="20" y="20" width="345" height="6" rx="3" fill="#4285f4"/>
    <circle cx="60" cy="65" r="20" fill="#eaf1fd"/>
    <text x="60" y="72" text-anchor="middle" font-size="20" font-weight="800" fill="#1769e0">1</text>
    <text x="95" y="73" font-size="22" font-weight="700" fill="#0f172a">Deploy</text>
    <text x="40" y="115" font-size="16" fill="#334155">Run one command in a terminal:</text>
    <rect x="40" y="132" width="305" height="44" rx="8" fill="#0f172a"/>
    <text x="56" y="160" font-size="16" font-family="Consolas, ui-monospace, monospace" font-weight="600" fill="#9ec1ff">npx tasks-todo-sync init</text>
  </g>

  <!-- Card 2: Google sign-in -->
  <g filter="url(#soft)">
    <rect x="395" y="20" width="345" height="190" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="395" y="20" width="345" height="6" rx="3" fill="#0891b2"/>
    <circle cx="435" cy="65" r="20" fill="#e0f2fe"/>
    <text x="435" y="72" text-anchor="middle" font-size="20" font-weight="800" fill="#0284c7">2</text>
    <text x="470" y="73" font-size="22" font-weight="700" fill="#0f172a">Google sign-in</text>
    <text x="415" y="115" font-size="16" fill="#334155">One consent screen in the</text>
    <text x="415" y="139" font-size="16" fill="#334155">browser wizard that opens.</text>
    <text x="415" y="172" font-size="14.5" fill="#64748b">“Unverified app” → Advanced → Allow</text>
  </g>

  <!-- Card 3: Microsoft sign-in -->
  <g filter="url(#soft)">
    <rect x="20" y="230" width="345" height="190" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="20" y="230" width="345" height="6" rx="3" fill="#7c3aed"/>
    <circle cx="60" cy="275" r="20" fill="#f3e8ff"/>
    <text x="60" y="282" text-anchor="middle" font-size="20" font-weight="800" fill="#7c3aed">3</text>
    <text x="95" y="283" font-size="22" font-weight="700" fill="#0f172a">Microsoft sign-in</text>
    <text x="40" y="325" font-size="16" fill="#334155">Enter a short code at the</text>
    <text x="40" y="349" font-size="16" fill="#334155">official microsoft.com/link page.</text>
    <text x="40" y="382" font-size="14.5" fill="#64748b">No Entra app, secret, or redirect URI</text>
  </g>

  <!-- Card 4: Finalize -->
  <g filter="url(#soft)">
    <rect x="395" y="230" width="345" height="190" rx="16" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.5"/>
    <rect x="395" y="230" width="345" height="6" rx="3" fill="#16a34a"/>
    <circle cx="435" cy="275" r="20" fill="#dcfce7"/>
    <text x="435" y="282" text-anchor="middle" font-size="20" font-weight="800" fill="#16a34a">✓</text>
    <text x="470" y="283" font-size="22" font-weight="700" fill="#0f172a">Finalize</text>
    <text x="415" y="325" font-size="16" fill="#334155">Preview, 10-minute trigger,</text>
    <text x="415" y="349" font-size="16" fill="#334155">and health check run themselves.</text>
    <text x="415" y="382" font-size="14.5" fill="#15803d" font-weight="600">Sync is live — changes land in 0–10 min</text>
  </g>

  <!-- Footer Banner -->
  <rect x="20" y="440" width="720" height="44" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <g font-size="14.5" font-weight="500" fill="#334155">
    <text x="36" y="467">Two sign-ins total</text>
    <circle cx="172" cy="463" r="2.5" fill="#94a3b8"/>
    <text x="187" y="467">About 3 minutes</text>
    <circle cx="310" cy="463" r="2.5" fill="#94a3b8"/>
    <text x="325" y="467">Runs in your Google account</text>
    <circle cx="538" cy="463" r="2.5" fill="#94a3b8"/>
    <text x="553" y="467" fill="#0284c7" font-weight="700">No hosted service</text>
  </g>
</svg>
