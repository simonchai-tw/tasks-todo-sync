<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Tasks–To Do Sync</title>
  <desc id="desc">A private Google Apps Script bridge connecting Google Tasks with Microsoft To Do.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050d19"/>
      <stop offset="0.52" stop-color="#0a1c31"/>
      <stop offset="1" stop-color="#171b3b"/>
    </linearGradient>
    <linearGradient id="bridge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4285f4"/>
      <stop offset="0.5" stop-color="#6ee7f9"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="leftCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#102b4c"/>
      <stop offset="1" stop-color="#0b1c31"/>
    </linearGradient>
    <linearGradient id="rightCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#25204c"/>
      <stop offset="1" stop-color="#111a34"/>
    </linearGradient>
    <radialGradient id="glowBlue">
      <stop offset="0" stop-color="#4285f4" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#4285f4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#ffffff" stroke-opacity="0.022"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.34"/>
    </filter>
  </defs>

  <rect width="1200" height="420" rx="30" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="30" fill="url(#grid)"/>
  <ellipse cx="340" cy="220" rx="360" ry="250" fill="url(#glowBlue)"/>
  <ellipse cx="880" cy="230" rx="360" ry="260" fill="url(#glowViolet)"/>

  <text x="600" y="69" text-anchor="middle" fill="#ffffff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="39" font-weight="800" letter-spacing="3.5">TASKS ↔ TO DO</text>
  <text x="600" y="105" text-anchor="middle" fill="#b9cbe0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="650" letter-spacing="1.7">TWO ECOSYSTEMS · ONE TASK LOOP</text>

  <g filter="url(#shadow)">
    <rect x="72" y="138" width="390" height="176" rx="22" fill="url(#leftCard)" stroke="#5b9cff" stroke-opacity="0.46"/>
    <rect x="738" y="138" width="390" height="176" rx="22" fill="url(#rightCard)" stroke="#9b7cff" stroke-opacity="0.48"/>
  </g>

  <g transform="translate(104 171)">
    <circle cx="29" cy="29" r="29" fill="#4285f4"/>
    <path d="M16 29l9 9 18-21" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="76" y="24" fill="#f5f9ff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23" font-weight="700">Google Tasks</text>
    <text x="76" y="51" fill="#9fb5cb" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">Your Google task workspace</text>
    <rect x="0" y="90" width="322" height="1" fill="#b6d3ff" opacity="0.15"/>
    <text x="0" y="120" fill="#c8d8e8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" letter-spacing="0.6">LISTS  ·  TASKS  ·  DUE DATES</text>
  </g>

  <g transform="translate(770 171)">
    <circle cx="29" cy="29" r="29" fill="#7656e8"/>
    <path d="M15 31l9 8 20-23M20 23l7 6" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="76" y="24" fill="#f5f9ff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23" font-weight="700">Microsoft To Do</text>
    <text x="76" y="51" fill="#aeb6d7" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">Your Microsoft task workspace</text>
    <rect x="0" y="90" width="322" height="1" fill="#d6caff" opacity="0.15"/>
    <text x="0" y="120" fill="#d2d3ea" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" letter-spacing="0.45">LISTS  ·  TASKS  ·  DUE DATES</text>
  </g>

  <g>
    <path d="M458 226H528" fill="none" stroke="#55b8ff" stroke-width="4" stroke-linecap="round"/>
    <path d="M672 226H742" fill="none" stroke="#9275ff" stroke-width="4" stroke-linecap="round"/>
  </g>

  <g transform="translate(600 226)" filter="url(#shadow)">
    <circle r="72" fill="#071321" stroke="url(#bridge)" stroke-width="3.5"/>
    <circle r="58" fill="none" stroke="#ffffff" stroke-opacity="0.09"/>
    <path d="M-38-11h58L8-23M38 11h-58l12 12" fill="none" stroke="url(#bridge)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="0" y="47" text-anchor="middle" fill="#d4e2ef" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11" font-weight="750" letter-spacing="1.55">PRIVATE BRIDGE</text>
  </g>

  <g transform="translate(310 356)">
    <rect width="580" height="36" rx="18" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.1"/>
    <circle cx="24" cy="17" r="5" fill="#42d392"/>
    <text x="42" y="23" fill="#cfdae6" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="600" letter-spacing="0.65">RUNS IN YOUR GOOGLE ACCOUNT  ·  NO HOSTED MIDDLEMAN</text>
  </g>
</svg>
