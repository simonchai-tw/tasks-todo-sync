<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Tasks–To Do Sync</title>
  <desc id="desc">A private Google Apps Script bridge connecting Google Tasks with Microsoft To Do.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0b1d33"/>
      <stop offset="1" stop-color="#102b43"/>
    </linearGradient>
    <linearGradient id="bridge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4285f4"/>
      <stop offset="0.5" stop-color="#6ee7f9"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="leftCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#102b4c"/>
      <stop offset="1" stop-color="#0b1c31"/>
    </linearGradient>
    <linearGradient id="rightCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#25204c"/>
      <stop offset="1" stop-color="#111a34"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#70e1f5" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#70e1f5" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
  </defs>

  <rect width="1200" height="420" rx="30" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="30" fill="url(#grid)"/>
  <circle cx="600" cy="232" r="190" fill="url(#glow)"/>

  <text x="600" y="66" text-anchor="middle" fill="#f7fbff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="750" letter-spacing="5">TASKS ↔ TO DO</text>
  <text x="600" y="102" text-anchor="middle" fill="#a9bdd3" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" letter-spacing="1.2">ONE TASK · EVERY ECOSYSTEM</text>

  <g filter="url(#shadow)">
    <rect x="72" y="138" width="390" height="176" rx="24" fill="url(#leftCard)" stroke="#4285f4" stroke-opacity="0.34"/>
    <rect x="738" y="138" width="390" height="176" rx="24" fill="url(#rightCard)" stroke="#8b5cf6" stroke-opacity="0.4"/>
  </g>

  <g transform="translate(104 171)">
    <circle cx="29" cy="29" r="29" fill="#4285f4"/>
    <path d="M16 29l9 9 18-21" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="76" y="24" fill="#f5f9ff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23" font-weight="700">Google Tasks</text>
    <text x="76" y="51" fill="#9fb5cb" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">Your Google task source of truth</text>
    <rect x="0" y="90" width="322" height="1" fill="#b6d3ff" opacity="0.15"/>
    <text x="0" y="120" fill="#c8d8e8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" letter-spacing="0.6">GEMINI  ·  GMAIL  ·  ANDROID</text>
  </g>

  <g transform="translate(770 171)">
    <circle cx="29" cy="29" r="29" fill="#7656e8"/>
    <path d="M15 31l9 8 20-23M20 23l7 6" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="76" y="24" fill="#f5f9ff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23" font-weight="700">Microsoft To Do</text>
    <text x="76" y="51" fill="#aeb6d7" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">Your Microsoft and iOS task hub</text>
    <rect x="0" y="90" width="322" height="1" fill="#d6caff" opacity="0.15"/>
    <text x="0" y="120" fill="#d2d3ea" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" letter-spacing="0.45">TO DO  ·  iOS REMINDERS</text>
  </g>

  <g transform="translate(600 226)">
    <circle r="76" fill="#091727" stroke="url(#bridge)" stroke-width="3"/>
    <circle r="61" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
    <path d="M-34-10h54l-12-12M34 10h-54l12 12" fill="none" stroke="url(#bridge)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="0" y="48" text-anchor="middle" fill="#b9cadb" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.4">PRIVATE BRIDGE</text>
  </g>

  <g transform="translate(310 357)">
    <rect width="580" height="34" rx="17" fill="#ffffff" fill-opacity="0.055" stroke="#ffffff" stroke-opacity="0.08"/>
    <circle cx="24" cy="17" r="5" fill="#42d392"/>
    <text x="42" y="22" fill="#b9cada" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" letter-spacing="0.55">GOOGLE APPS SCRIPT  ·  15-MINUTE SYNC  ·  SAFE BY DEFAULT</text>
  </g>
</svg>
