<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">How Tasks–To Do Sync works</title>
  <desc id="desc">A simple flow chart showing Google Tasks and Microsoft To Do synchronizing in both directions through a private Google Apps Script project.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1198" height="278" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <rect x="65" y="76" width="280" height="112" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="205" y="122" text-anchor="middle" fill="#24292f" font-size="22" font-weight="600">Google Tasks</text>
    <text x="205" y="152" text-anchor="middle" fill="#57606a" font-size="14">lists · tasks · status · dates</text>

    <rect x="460" y="66" width="280" height="132" rx="8" fill="#f6f8fa" stroke="#57606a" stroke-width="2"/>
    <text x="600" y="117" text-anchor="middle" fill="#24292f" font-size="21" font-weight="600">Tasks–To Do Sync</text>
    <text x="600" y="147" text-anchor="middle" fill="#57606a" font-size="14">Google Apps Script</text>

    <rect x="855" y="76" width="280" height="112" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="995" y="122" text-anchor="middle" fill="#24292f" font-size="22" font-weight="600">Microsoft To Do</text>
    <text x="995" y="152" text-anchor="middle" fill="#57606a" font-size="14">lists · tasks · status · dates</text>

    <line x1="370" y1="132" x2="435" y2="132" stroke="#57606a" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <line x1="765" y1="132" x2="830" y2="132" stroke="#57606a" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

    <text x="402" y="109" text-anchor="middle" fill="#6e7781" font-size="12">read / write</text>
    <text x="798" y="109" text-anchor="middle" fill="#6e7781" font-size="12">read / write</text>

    <text x="600" y="242" text-anchor="middle" fill="#6e7781" font-size="13">Runs every 15 minutes from your own Apps Script project</text>
  </g>
</svg>
