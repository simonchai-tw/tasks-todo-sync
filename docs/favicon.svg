<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Squircle Gradient (Deep Indigo Midnight Glass) -->
    <linearGradient id="bgGrad3" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#111c35"/>
      <stop offset="35%" stop-color="#0b1325"/>
      <stop offset="100%" stop-color="#03060d"/>
    </linearGradient>

    <!-- Specular Bevel Rim (Top-left light source) -->
    <linearGradient id="rimGrad3" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.45)"/>
      <stop offset="20%" stop-color="rgba(147, 197, 253, 0.3)"/>
      <stop offset="60%" stop-color="rgba(30, 58, 138, 0.25)"/>
      <stop offset="100%" stop-color="rgba(2, 6, 23, 0.7)"/>
    </linearGradient>

    <!-- Inner Ambient Radial Glow -->
    <radialGradient id="ambientGlow3" cx="50%" cy="46%" r="52%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.28"/>
      <stop offset="50%" stop-color="#0284C7" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0B1325" stop-opacity="0"/>
    </radialGradient>

    <!-- Top Arrow Gradient (Google Cloud Blue to Bright Sky) -->
    <linearGradient id="googleArrowGrad3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1D4ED8"/>
      <stop offset="25%" stop-color="#3B82F6"/>
      <stop offset="75%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#BFDBFE"/>
    </linearGradient>

    <!-- Bottom Arrow Gradient (Microsoft Cobalt Blue to Vibrant Emerald-Teal) -->
    <linearGradient id="msArrowGrad3" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#0369A1"/>
      <stop offset="28%" stop-color="#0284C7"/>
      <stop offset="70%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>

    <!-- Floating Drop Shadow for Squircle Tile -->
    <filter id="badgeShadow3" x="-20%" y="-15%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000000" flood-opacity="0.55"/>
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.3"/>
    </filter>

    <!-- Luminous Arrow Depth Drop Shadow -->
    <filter id="arrowShadow3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>

    <!-- Socket Glow Filters -->
    <filter id="dotGlowGoogle3" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#60A5FA" flood-opacity="0.95"/>
    </filter>

    <filter id="dotGlowMs3" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#34D399" flood-opacity="0.95"/>
    </filter>
  </defs>

  <!-- Squircle Base with Multi-Stage Drop Shadow -->
  <g filter="url(#badgeShadow3)">
    <rect x="42" y="42" width="428" height="428" rx="108" fill="url(#bgGrad3)"/>
  </g>

  <!-- Ambient Light Center -->
  <rect x="42" y="42" width="428" height="428" rx="108" fill="url(#ambientGlow3)"/>

  <!-- Outer Fluent Glass Rim (Multi-Stop Specular Gradient) -->
  <rect x="43.5" y="43.5" width="425" height="425" rx="106.5" fill="none" stroke="url(#rimGrad3)" stroke-width="3"/>

  <!-- Inner Soft Inset Glow -->
  <rect x="46" y="46" width="420" height="420" rx="104" fill="none" stroke="rgba(255, 255, 255, 0.07)" stroke-width="1.5"/>

  <!-- ================= TOP ARROW (Google Tasks: Left -> Right) ================= -->
  <g filter="url(#arrowShadow3)">
    <!-- Main stem + arrowhead: 40px heavy stroke for high-DPI and 16x16 icon crispness -->
    <path d="M 144 194 H 344 M 304 154 L 356 194 L 304 234"
          fill="none"
          stroke="url(#googleArrowGrad3)"
          stroke-width="40"
          stroke-linecap="round"
          stroke-linejoin="round"/>
  </g>

  <!-- Google Origin Lens Socket (Inner pure white, outer cyan glow ring) -->
  <circle cx="144" cy="194" r="15" fill="#FFFFFF" filter="url(#dotGlowGoogle3)"/>
  <circle cx="144" cy="194" r="7.5" fill="#2563EB"/>

  <!-- ================= BOTTOM ARROW (Microsoft To Do: Right -> Left) ================= -->
  <g filter="url(#arrowShadow3)">
    <!-- Main stem + arrowhead: 40px heavy stroke -->
    <path d="M 368 318 H 168 M 208 278 L 156 318 L 208 358"
          fill="none"
          stroke="url(#msArrowGrad3)"
          stroke-width="40"
          stroke-linecap="round"
          stroke-linejoin="round"/>
  </g>

  <!-- Microsoft Origin Lens Socket (Inner pure white, outer emerald glow ring) -->
  <circle cx="368" cy="318" r="15" fill="#FFFFFF" filter="url(#dotGlowMs3)"/>
  <circle cx="368" cy="318" r="7.5" fill="#0284C7"/>

</svg>
