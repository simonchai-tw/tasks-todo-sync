<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#050814"/>
    </linearGradient>
    <linearGradient id="gBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4285F4"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="mTeal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0078D4"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#4285F4" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#233554" stroke-width="2"/>

  <!-- Subtle inner glow rim -->
  <rect x="3" y="3" width="58" height="58" rx="15" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Top Arrow / Sync Bar (Google Blue): Left to Right with Arrowhead -->
  <path d="M16 23 h26 M36 17 l7 6 -7 6" 
        fill="none" 
        stroke="url(#gBlue)" 
        stroke-width="5" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Bottom Arrow / Sync Bar (Microsoft Blue -> Teal): Right to Left with Arrowhead -->
  <path d="M48 41 h-26 M28 35 l-7 6 7 6" 
        fill="none" 
        stroke="url(#mTeal)" 
        stroke-width="5" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Central Sync Centerpiece Checkmark dots -->
  <circle cx="21" cy="23" r="2.5" fill="#ffffff"/>
  <circle cx="43" cy="41" r="2.5" fill="#ffffff"/>
</svg>